trigger:
- dev

pool:
  vmImage: 'ubuntu-latest'

services:
  mysql:
    image: mysql:8.0
    env:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: test_db
    ports:
      - 3306:3306
    # Essential for MySQL initialization checks on hosted runners
    options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

variables:

  # Azure Resource Manager connection created during pipeline creation
  azureSubscription: '534a04fa-2bc4-440a-956b-bffd749e21f6'

  # Web app name
  webAppName: 'training-app'

  # Environment name
  environmentName: 'dev'

steps:
  - task: NodeTool@0
    inputs:
      versionSpec: '18.x'
    displayName: 'Install Node.js'

  - script: |
      npm ci
      npm run build
      npm test
    displayName: 'Install, build, and test'